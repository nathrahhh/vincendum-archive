version: "3.8"

services:

  postgres:
    image: postgres:16
    container_name: credit-risk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always


  redis:
    image: redis:7-alpine
    container_name: credit-risk-redis
    restart: always


  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev.backend

    command: >
      sh -c "alembic upgrade head &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000"

    container_name: credit-risk-backend

    environment:
      DATABASE_URL: postgresql://postgres:Re:Dialed@host.docker.internal:5432/credit_risk_engine
      REDIS_URL: redis://redis:6379

      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_ISSUER: ${AUTH0_ISSUER}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev.frontend
    container_name: credit-risk-frontend
    depends_on:
      - backend
    ports:
      - "5173:4173"
    restart: always


volumes:
  postgres_data: