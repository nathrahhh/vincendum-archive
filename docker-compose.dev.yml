services:

  postgres:
    image: postgres:16
    container_name: credit-risk-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: credit_risk_engine
    ports:
      - "5433:5432"
    volumes:
      - credit-risk-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: credit-risk-redis
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev.backend

    command: >
      sh -c "python -c 'from app.db import init_db; init_db()' &&
            alembic stamp head &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000"

    container_name: credit-risk-backend

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/credit_risk_engine

      REDIS_URL: redis://redis:6379

      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_ISSUER: ${AUTH0_ISSUER}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

      TRUELAYER_ENVIRONMENT: ${TRUELAYER_ENVIRONMENT}
      TRUELAYER_CLIENT_ID: ${TRUELAYER_CLIENT_ID}
      TRUELAYER_CLIENT_SECRET: ${TRUELAYER_CLIENT_SECRET}
      TRUELAYER_REDIRECT_URI: ${TRUELAYER_REDIRECT_URI}
      OPEN_BANKING_FRONTEND_CALLBACK_URL: ${OPEN_BANKING_FRONTEND_CALLBACK_URL}

    depends_on:
      - postgres
      - redis

    ports:
      - "8000:8000"

    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev.frontend

    container_name: credit-risk-frontend

    depends_on:
      - backend

    ports:
      - "5173:4173"

    restart: always

volumes:
  credit-risk-postgres-data: